<!-- Firebase + Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
databaseURL: "https://royalgamesproject-default-rtdb.asia-southeast1.firebasedatabase.app"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let bookingData=null;
let bookingInProgress=false;

function sendToWhatsApp(){

if(bookingInProgress) return;

const name=document.getElementById('name').value.trim();
const phone=document.getElementById('phone').value.trim();
const consoleType=document.getElementById('console').value;
const startDate=document.getElementById('startDate').value;
const days=document.getElementById('days').value;
const coupon=document.getElementById('coupon').value.trim().toUpperCase();
const requestedGame=document.getElementById('requestedGame').value.trim();

if(!name||!phone||!startDate||!days){
alert('Please fill all fields!');
return;
}

let total = consoleType==="PS5"? (days=="1"?500:800) : (days=="1"?400:700);
let discount=0;
if(coupon==="RG50") discount=50;
if(coupon==="PS5OFF" && consoleType==="PS5") discount=50;
if(coupon==="XBOX50" && consoleType==="Xbox One") discount=50;
let final=total-discount;
if(final<0) final=0;

let custID='RG'+Date.now();

bookingData={
customerID:custID,
name,phone,
console:consoleType,
startDate,days,
coupon:coupon||'None',
totalPrice:total,
discount,
finalPrice:final,
requestedGame:requestedGame||'N/A'
};

document.getElementById("royalPopup").style.display="flex";
}

function confirmBooking(){

if(!bookingData) return;
bookingInProgress=true;

db.ref('bookings/'+bookingData.customerID).set({
...bookingData,
status:"Active",
timestamp:Date.now()
}).then(()=>{

generateInvoicePDF(bookingData);

const msg=`🎮 *Royal Games Booking*
⚠️ Do NOT edit this message otherwise booking not considered.

Customer ID: ${bookingData.customerID}
Name: ${bookingData.name}
Phone: ${bookingData.phone}
Console: ${bookingData.console}
Booking Date: ${bookingData.startDate}
Duration: ${bookingData.days} Day(s)
Package Price: ₹${bookingData.totalPrice}
Coupon: ${bookingData.coupon}
Discount: ₹${bookingData.discount}
Final Price: ₹${bookingData.finalPrice}
Requested Game: ${bookingData.requestedGame}`;

let url="https://wa.me/919303088645?text="+encodeURIComponent(msg);
window.open(url,'_blank');

document.getElementById("royalPopup").style.display="none";
bookingInProgress=false;

});
}

function closePopup(){
document.getElementById("royalPopup").style.display="none";
}

</script>

<!-- ROYAL POPUP -->
