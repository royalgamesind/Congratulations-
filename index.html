<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Games Winner Reveal 💌</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top,#0a0a0f,#11111a);
  font-family:Arial, Helvetica, sans-serif;
  color:#fff;
  overflow:hidden;
}

/* Title */
h1{
  text-align:center;
  text-shadow:0 0 10px #0ff,0 0 20px #0ff;
  margin-bottom:10px;
  font-size:2rem;
}

/* Input + Button */
input,button{
  padding:12px;
  margin:6px;
  border-radius:12px;
  border:none;
  font-weight:bold;
  font-size:16px;
}

input{
  background:#1f2937;
  color:white;
  width:260px;
  text-align:center;
}

button{
  cursor:pointer;
  background:linear-gradient(45deg,#ff4500,#ffcc00);
  color:#000;
  box-shadow:0 0 12px #ffcc00;
  transition:.25s;
}

button:hover{
  transform:scale(1.07);
  box-shadow:0 0 25px #ff4500,0 0 40px #ffcc00 inset;
}

/* Winner Card */
#winner-section{
  display:none;
  position:relative;
  width:92%;
  max-width:520px;
  height:62%;
  margin-top:20px;
  background:url('https://images.unsplash.com/photo-1606813907291-d86efa9b94db?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
  border-radius:22px;
  box-shadow:0 0 30px #0ff,0 0 70px #0ff inset;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  overflow:hidden;
}

/* Overlay */
#text-overlay{
  background:rgba(0,0,0,0.55);
  border-radius:18px;
  padding:22px;
  text-align:center;
  width:85%;
}

/* Prize */
#prize-text{
  font-size:24px;
  font-weight:bold;
  color:#00ffff;
  text-shadow:0 0 10px #0ff,0 0 20px #0ff;
  animation:glow 1.5s infinite alternate;
}

/* Coupon */
#coupon-text{
  font-size:20px;
  margin-top:10px;
  color:#ffff00;
  text-shadow:0 0 5px #ff0,0 0 10px #ff0;
}

/* Booking Note Box */
#booking-note{
  margin-top:14px;
  font-size:14px;
  line-height:1.5;
  background:rgba(0,255,255,0.08);
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(0,255,255,0.45);
}

/* Booking Button */
#booking-note a{
  display:inline-block;
  margin-top:12px;
  padding:12px 18px;
  background:linear-gradient(45deg,#00ffff,#00ffa6);
  color:#000;
  font-weight:bold;
  text-decoration:none;
  border-radius:12px;
  box-shadow:0 0 14px #00ffff;
  transition:.25s;
}

#booking-note a:hover{
  transform:scale(1.08);
  box-shadow:0 0 25px #00ffff;
}

/* Glow animation */
@keyframes glow{
  0%{text-shadow:0 0 5px #0ff,0 0 15px #0ff;}
  100%{text-shadow:0 0 18px #0ff,0 0 35px #0ff;}
}

/* Confetti */
.confetti{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  animation:fall 1.7s linear forwards;
  opacity:0.9;
}

@keyframes fall{
  0%{transform:translateY(0) rotate(0deg);}
  100%{transform:translateY(420px) rotate(720deg);opacity:0;}
}
</style>

</head>

<body>

<h1>🎮 Royal Games Winner 💌</h1>
<p>Enter your winner password:</p>

<input type="text" id="winnerCode" placeholder="Enter password">
<button onclick="showWinner()">Reveal Your Gift</button>

<!-- Winner Card -->

<div id="winner-section">
  <div id="text-overlay">
    <div id="prize-text"></div>
    <div id="coupon-text"></div>
    <div id="booking-note"></div>
  </div>
</div>

<script>

// Winner database (YOU CAN CHANGE CODES HERE ANYTIME)
const winners={
  "WINNER10":{prize:"🥇 1 Day PS5 Rental FREE",code:"CONGRATS100"},
  "WINNER02":{prize:"🥈 50% OFF",code:"CONGRATS50"},
  "WINNER45":{prize:"🥉 40% OFF",code:"CONGRATS40"}
};

const winnerSection=document.getElementById('winner-section');
const prizeText=document.getElementById('prize-text');
const couponText=document.getElementById('coupon-text');
const bookingNote=document.getElementById('booking-note');

function showWinner(){
  const code=document.getElementById('winnerCode').value.trim().toUpperCase();

  if(winners[code]){
    const winner=winners[code];

    prizeText.innerHTML=winner.prize;
    couponText.innerHTML=`🎟️ Coupon: <b>${winner.code}</b><br>Valid for 1-day PS5 rental`;

    bookingNote.innerHTML=`
    ⚠️ <b>Important:</b><br>
    Use this coupon while filling the booking form on our official website.
    Discount will automatically apply on <b>1 Day PS5 Rent</b>.

    <br><br>

    <a href="https://royalgamesind.github.io/Royal-games/?coupon=${winner.code}" target="_blank">
    🎮 Book Now & Claim Discount
    </a>
    `;

    winnerSection.style.display="flex";
    createConfetti();

  }else{
    alert("❌ Invalid password! Only winners can see their gift.");
  }
}

// Confetti animation
function createConfetti(){
  for(let i=0;i<60;i++){
    const conf=document.createElement('div');
    conf.classList.add('confetti');
    conf.style.background=randomColor();
    conf.style.left=Math.random()*window.innerWidth+"px";
    conf.style.top="0px";
    conf.style.width=conf.style.height=Math.random()*10+6+"px";
    document.body.appendChild(conf);
    setTimeout(()=>conf.remove(),1700);
  }
}

function randomColor(){
  const colors=['#ff0','#ff4500','#0ff','#f0f','#0f0','#fff'];
  return colors[Math.floor(Math.random()*colors.length)];
}

</script>

</body>
</html>
