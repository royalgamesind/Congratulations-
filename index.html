<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Games Winner Reveal 💌</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #0a0a0f, #11111a);
  font-family: 'Arial', sans-serif;
  color: #fff;
  overflow: hidden;
}

h1 {
  text-align:center;
  text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
  margin-bottom: 10px;
  font-size: 2rem;
}

input, button {
  padding: 12px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  font-size: 16px;
}

button {
  cursor: pointer;
  background: linear-gradient(45deg,#ff4500,#ffcc00);
  color: #000;
  font-weight: bold;
  box-shadow: 0 0 10px #ffcc00;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #ff4500, 0 0 40px #ffcc00 inset;
}

/* Winner Section */
#winner-section {
  display: none;
  position: relative;
  width: 90%;
  max-width: 500px;
  height: 60%;
  margin-top: 20px;
  background: url('ChatGPT Image Feb 11, 2026, 05_06_43 PM.png') center/cover no-repeat;
  border-radius: 20px;
  box-shadow: 0 0 30px #0ff, 0 0 60px #0ff inset;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  overflow: hidden;
}

/* Prize Text Background Overlay */
#text-overlay {
  background: rgba(0,0,0,0.5); /* dark overlay for text readability */
  border-radius: 15px;
  padding: 20px;
  text-align: center;
}

#prize-text {
  font-size: 24px;
  font-weight: bold;
  color: #0ff;
  text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
  animation: glow 1.5s infinite alternate;
}

#coupon-text {
  font-size: 20px;
  margin-top: 10px;
  color: #ff0;
  text-shadow: 0 0 5px #ff0, 0 0 10px #ff0;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  0% { text-shadow: 0 0 5px #0ff, 0 0 15px #0ff; }
  100% { text-shadow: 0 0 15px #0ff, 0 0 30px #0ff; }
}

/* Confetti */
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  animation: fall 1.5s linear forwards;
  opacity: 0.9;
}
@keyframes fall {
  0% {transform: translateY(0) rotate(0deg);}
  100% {transform: translateY(400px) rotate(720deg); opacity: 0;}
}
</style>
</head>
<body>

<h1>🎮 Royal Games Winner 💌</h1>
<p>Enter your winner password:</p>
<input type="text" id="winnerCode" placeholder="Enter password">
<button onclick="showWinner()">Reveal Your Gift</button>

<div id="winner-section">
  <div id="text-overlay">
    <div id="prize-text"></div>
    <div id="coupon-text"></div>
  </div>
</div>

<script>
// Winner data
const winners = {
  "WINNER10": { prize:"🥇 1 Day PS5 Rental FREE", code:"CONGRATS100" },
  "WINNER02": { prize:"🥈 50% OFF", code:"CONGRATS50" },
  "WINNER45": { prize:"🥉 40% OFF", code:"CONGRATS40" }
};

const winnerSection = document.getElementById('winner-section');
const prizeText = document.getElementById('prize-text');
const couponText = document.getElementById('coupon-text');

function showWinner() {
  const code = document.getElementById('winnerCode').value.trim().toUpperCase();
  if(winners[code]){
    const winner = winners[code];
    prizeText.innerHTML = winner.prize;
    couponText.innerHTML = `Coupon: ${winner.code}<br>Valid for 1-day rental only`;
    winnerSection.style.display = "flex";
    createConfetti();
  } else {
    alert("❌ Invalid password! Only winners can see their gift.");
  }
}

// Confetti
function createConfetti(){
  for(let i=0;i<50;i++){
    const conf = document.createElement('div');
    conf.classList.add('confetti');
    conf.style.background = randomColor();
    conf.style.left = Math.random()*window.innerWidth + "px";
    conf.style.top = "0px";
    conf.style.width = conf.style.height = Math.random()*10 + 5 + "px";
    document.body.appendChild(conf);
    setTimeout(()=> conf.remove(),1600);
  }
}
function randomColor(){
  const colors = ['#ff0','#ff4500','#0ff','#f0f','#0f0','#fff'];
  return colors[Math.floor(Math.random()*colors.length)];
}
</script>

</body>
</html>
